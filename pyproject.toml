[tool.poetry]
name = "api-metrology"
version = "0.1.0"
description = "part of the project aimed at the metrology sector of the company LG"
authors = ["Joel Junior <joelrool.junior@lgepartner.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.116.1"}
sqlalchemy = "^2.0.41"

[tool.poetry.group.dev.dependencies]
blue = "^0.9.1"
isort = "^6.0.1"

[tool.blue]
line-length = 88
target-version = ["py38"]
skip-string-normalization = false
skip-magic-trailing-comma = false

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
known_first_party = ["meuprojeto"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
